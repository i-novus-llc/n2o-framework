include:
  - project: ${PIPELINE_REPOSITORY_PREFIX}devenv/gitlab/pipelines
    ref: 4.0.3
    file:
      - dev-stand.gitlab-ci.yml
      - story.gitlab-ci.yml
      - merge-request.gitlab-ci.yml
      - stable-stand.gitlab-ci.yml
  - local: 'release-stand.gitlab-ci.yaml'

build:
  variables:
    MAVEN_EXTRA_BUILD_OPTIONS: '-Pfrontend,frontend-build,backend,!examples,jacoco,demo,docs,sandbox'
    JDK_VERSION: 'jdk17'
    NODE_VERSION: 'node18'
    MAVEN_IMAGE_VERSION: 'v5'

build and verify:
  variables:
    MAVEN_GOAL: 'verify'
    MAVEN_EXTRA_GOAL: 'install:install'
    MAVEN_EXTRA_BUILD_OPTIONS: '-Pfrontend,frontend-build,backend,!examples,jacoco,demo,docs,sandbox'
    JDK_VERSION: 'jdk17'
    NODE_VERSION: 'node18'
    MAVEN_IMAGE_VERSION: 'v5'
  artifacts:
    paths:
      - $CI_PROJECT_DIR/.m2/repository/
    expire_in: 1 day
  cache: []

autotesting mr stand:
  extends: .autotesting mr stand
  variables:
    AUTOTEST_PARAMS: '-Pautotests -o'
    AUTOTEST_MODULE_DIR: './backend/n2o/n2o-autotest'
    JDK_VERSION: 'jdk17'
    NODE_VERSION: 'node18'
    MAVEN_IMAGE_VERSION: 'v5'

  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  dependencies:
    - build and verify
    - deploy mr stand

build story:
  variables:
    MAVEN_EXTRA_BUILD_OPTIONS: '-Pfrontend,frontend-build,backend,!examples,jacoco,demo,docs,sandbox'
    JDK_VERSION: 'jdk17'
    NODE_VERSION: 'node18'
    MAVEN_IMAGE_VERSION: 'v5'
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^story\/.+/ && $CI_PIPELINE_SOURCE == 'web'

build stable:
  variables:
    MAVEN_EXTRA_BUILD_OPTIONS: '-Pfrontend,frontend-build,backend,!examples,jacoco,demo,docs,sandbox'

cleanup:
  dependencies: []

deploy story stand:
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^story\/.+/ && $CI_PIPELINE_SOURCE == 'web'

deploy stable stand:
  variables:
    K8S_NAMESPACE: "n2o-framework-a"
    K8S_INGRESS_HOST: "7-27-n2o.i-novus.ru"
    HELM_RELEASE: "n2o-framework-7-27"
  tags:
    - stable
    - n2o-framework-a