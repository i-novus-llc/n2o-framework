global:
  spring:
    useDefaultConsul: false

springServices:
  demo:
    imageName: n2o/demo
    resources:
      limits:
        memory: 700M
        cpu: 400m
      requests:
        memory: 100M
        cpu: 10m
    replicaCount: 1
    contextPath: demo
    startupProbe:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 30
    ingress:
      path: /demo
  n2o-sandbox:
    resources:
      limits:
        memory: 900M
        cpu: 300m
      requests:
        memory: 200M
        cpu: 10m